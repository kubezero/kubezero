---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-sso
  namespace: external-secrets
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"  # Internal Vault service
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
      # For SSO integration, you can also use token auth or other methods
      # auth:
      #   jwt:
      #     mountPath: "jwt"
      #     role: "external-secrets"
      #     serviceAccountRef:
      #       name: external-secrets
      #       namespace: external-secrets 